# @miasaki/dsh-sidebar only extends the Web profile: it reuses the existing
# DSH server rather than running a second application process.
- insert:
    # `name` is the npm package the loader imports; `id` is the service id.
    - id: sidebar
      name: "@miasaki/dsh-sidebar"
      config:
        # Sidebar metadata (review checklist state from M1 on) lives in its own
        # directory, deliberately not shared with canvas or synapse data.
        dataFile: !!js dshHomePath('miasaki-sidebar/state.json')
        # Extra authorities the /sidebar API host check accepts (host or
        # host:port); localhost and 127.0.0.1 are always allowed.
        trustedHosts: []

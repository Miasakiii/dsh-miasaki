[package]
name = "miasaki"
version = "0.1.0"
description = "Miasaki — 专属 DSH 桌面端"
authors = ["Miasaki"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
png = "0.17"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    # 运行期后端存活看门狗（OpenProcess + GetExitCodeProcess 判活）与
    # 外部客户端探测（Toolhelp32 进程树），见 main.rs「后端断连自愈」段。
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    # 孤儿回收（T2.4）：CreateJobObjectW 需要 Win32_Security 的 SECURITY_ATTRIBUTES，
    # 其余（AssignProcessToJobObject / SetInformationJobObject / KILL_ON_JOB_CLOSE）在
    # JobObjects 模块。用途：自拉后端纳入 Job → 壳异常消亡时由 OS 回收整棵进程树。
    "Win32_System_JobObjects",
    "Win32_Security",
    # 诊断报告事实头（T2.1）：系统版本读注册表 BuildLabEx（GetVersionExW 在未声明
    # 兼容性的进程里会撒谎），locale 走 GetUserDefaultLocaleName。
    "Win32_System_Registry",
    "Win32_Globalization",
    # W5 自更新降级方案：ShellExecuteW 打开下载页（交给系统默认浏览器）。
    # 2026-10-14 起还用于快捷方式图标跟随（shortcut_icon.rs）：IShellLinkW 的 CLSID、
    # SHChangeNotify 的 SHCNE_*/SHCNF_* 都在这个模块。
    "Win32_UI_Shell",
    # 快捷方式图标跟随（shortcut_icon.rs，2026-10-14）：CoCreateInstance /
    # CoInitializeEx 起 COM 拿 IShellLinkW + IPersistFile 改写 .lnk 的 IconLocation。
    # windows-sys 只给 FFI 与常量，接口的 vtable 由本仓照官方生成代码逐字段定义
    # （见 shortcut_icon.rs 顶部的对照说明）。
    "Win32_System_Com",
] }

[profile.release]
opt-level = 1
strip = true
lto = false
codegen-units = 8
panic = "abort"
